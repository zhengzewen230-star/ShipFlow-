    ApiSuccessQuotePage:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/QuotePage' }
    ApiSuccessQuoteValidation:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object

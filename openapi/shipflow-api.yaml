  /quotes:
    get:
      tags: [Quotes]
      summary: 分页查询当前租户报价历史
      operationId: listQuotes
      parameters:
        - name: quoteNo
          in: query
          schema: { type: string, maxLength: 64 }
        - name: storeId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: destinationCountry
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - name: channelId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: destinationCountry
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - name: status
          in: query
          schema: { type: string, enum: [VALID, EXPIRED, CANCELLED] }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - name: validFrom
          in: query
          schema: { type: string, format: date-time }
        - name: validTo
          in: query
          schema: { type: string, format: date-time }
        - name: sortField
          in: query
          schema: { type: string, enum: [createdAt, quoteNo, validTo, amount, status], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
        - name: status
          in: query
          schema: { type: string, enum: [VALID, EXPIRED, CANCELLED] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: 报价列表 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Quotes]
      summary: 创建报价
      operationId: createQuote
      description: |
        使用商家申报重量、尺寸、目的国家、物流渠道和已发布价格规则计算报价。
        报价创建后金额、计费输入和规则版本不可修改，只允许按生命周期规则失效。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: 报价创建成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/QuoteRuleError'

  /quotes/{quoteId}:
    get:
      tags: [Quotes]
      summary: 查询当前租户报价详情
      operationId: getQuote
      responses:
        '200': { description: 报价详情 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

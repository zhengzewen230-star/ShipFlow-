openapi: 3.0.3
info:
  title: ShipFlow API
  version: 1.0.0
  description: |
    ShipFlow 跨境物流履约与费用结算系统第一版 API 契约。
    所有租户业务接口从 JWT 身份上下文获取 tenant_id，不接受调用方任意传入。
servers:
  - url: /api/v1
    description: ShipFlow API v1
tags:
  - name: Auth
    description: 认证与当前用户
  - name: Tenant
    description: 平台租户管理
  - name: Store
    description: 当前租户店铺管理
  - name: User
    description: 当前租户用户管理
  - name: RBAC
    description: 角色与权限管理
  - name: LogisticsMaster
    description: 平台物流商、渠道和价格规则主数据
  - name: Quotes
    description: 运费报价
  - name: Orders
    description: 物流订单
  - name: Warehouse
    description: 仓库履约操作
  - name: Tracking
    description: 物流轨迹
  - name: Billing
    description: 账单导入
  - name: Reconciliation
    description: 费用对账
security:
  - bearerAuth: []
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: 获取 CSRF Token
      operationId: getCsrfToken
      security: []
      description: |
        匿名获取 CSRF Token。服务端使用 Spring Security CookieCsrfTokenRepository
        设置可由前端读取的 XSRF-TOKEN Cookie，不返回 Refresh Token。
      responses:
        '204':
          description: CSRF Cookie 已设置
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/XsrfCookie'

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLogin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/CsrfError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 Token
      operationId: refreshToken
      description: |
        从 HttpOnly Refresh Cookie 读取令牌，校验 CSRF 双提交请求头并执行 Refresh Token 轮换。
        客户端必须串行刷新；ROTATED Token 重复使用会撤销整个 family。
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      responses:
        '200':
          description: 刷新成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLogin'
        '401':
          $ref: '#/components/responses/AuthError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      operationId: logout
      description: |
        撤销当前 Refresh Token family 并清除 Refresh/XSRF Cookie。
        仅通过 Refresh Cookie 定位 family；Access Token 只是可选审计身份，不能单独定位或撤销 family。
        Refresh Cookie 已撤销、过期或不存在时保持幂等成功，不泄露具体原因。
        不要求 auth:logout 权限。logout-all 留待后续版本。
      security:
        - bearerAuth: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      responses:
        '200':
          description: 退出成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ClearedAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '403':
          $ref: '#/components/responses/CsrfError'

  /users/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCurrentUser'
        '401':
          $ref: '#/components/responses/AuthError'

  /platform/tenants:
    post:
      tags: [Tenant]
      summary: 创建租户和初始管理员
      operationId: createTenant
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: 租户与初始管理员已在同一事务创建。
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTenant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Tenant]
      summary: 分页查询租户
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TenantStatus' }
        - name: tenantCode
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 平台可见租户分页。
          headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenantPage' } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/tenants/{tenantId}:
    get:
      tags: [Tenant]
      summary: 查询租户详情
      operationId: getTenant
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      responses:
        '200': { description: 租户详情, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenant]
      summary: 修改租户基础信息
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTenantRequest' } } }
      responses:
        '200': { description: 更新后租户, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /platform/tenants/{tenantId}/status:
    post:
      tags: [Tenant]
      summary: 启用或停用租户
      operationId: changeTenantStatus
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } }
      responses:
        '200': { description: 新租户状态, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /stores:
    post:
      tags: [Store]
      summary: 创建当前租户店铺
      operationId: createStore
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStoreRequest' } } }
      responses:
        '201': { description: 店铺已创建, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Store]
      summary: 查询当前租户店铺
      operationId: listStores
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActiveStatus' }
        - name: platformCode
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200': { description: 当前租户店铺列表, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreList' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stores/{storeId}:
    get:
      tags: [Store]
      summary: 查询当前租户店铺详情
      operationId: getStore
      parameters: [ { $ref: '#/components/parameters/StoreId' } ]
      responses:
        '200': { description: 店铺详情, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Store]
      summary: 修改当前租户店铺
      operationId: updateStore
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStoreRequest' } } }
      responses:
        '200': { description: 更新后店铺, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /stores/{storeId}/status:
    post:
      tags: [Store]
      summary: 启用或停用当前租户店铺
      operationId: changeStoreStatus
      parameters: [ { $ref: '#/components/parameters/StoreId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } }
      responses:
        '200': { description: 新店铺状态, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users:
    post:
      tags: [User]
      summary: 创建当前租户用户
      operationId: createUser
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTenantUserRequest' } } }
      responses:
        '201': { description: 用户已创建, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [User]
      summary: 分页查询当前租户用户
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActiveStatus' }
        - name: username
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: 当前租户用户分页, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUserPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{userId}:
    get:
      tags: [User]
      summary: 查询当前租户用户详情
      operationId: getUser
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: 用户详情, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUser' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [User]
      summary: 修改当前租户用户
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } }
      responses:
        '200': { description: 更新后用户, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/status:
    post:
      tags: [User]
      summary: 启用或停用当前租户用户
      operationId: changeUserStatus
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } }
      responses:
        '200': { description: 新用户状态, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/roles:
    put:
      tags: [User]
      summary: 替换当前租户用户角色
      operationId: replaceUserRoles
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserRoleBindingRequest' } } }
      responses:
        '200': { description: 更新后用户与角色, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles:
    get:
      tags: [RBAC]
      summary: 查询当前租户角色
      operationId: listRoles
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActiveStatus' }
      responses:
        '200': { description: 当前租户角色列表, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessRoleList' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /roles/{roleId}:
    get:
      tags: [RBAC]
      summary: 查询当前租户角色详情
      operationId: getRole
      parameters: [ { $ref: '#/components/parameters/RoleId' } ]
      responses:
        '200': { description: 角色详情, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessRole' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles/{roleId}/permissions:
    put:
      tags: [RBAC]
      summary: 替换当前租户角色权限
      operationId: replaceRolePermissions
      parameters: [ { $ref: '#/components/parameters/RoleId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionBindingRequest' } } }
      responses:
        '200': { description: 更新后角色与权限, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessRole' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /permissions:
    get:
      tags: [RBAC]
      summary: 查询平台公共权限字典
      operationId: listPermissions
      responses:
        '200': { description: 可分配权限列表, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPermissionList' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/logistics-providers:
    get:
      tags: [LogisticsMaster]
      summary: 分页查询物流商
      operationId: listLogisticsProviders
      responses:
        '200': { description: 物流商分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsProviderPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [LogisticsMaster]
      summary: 创建物流商
      operationId: createLogisticsProvider
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLogisticsProviderRequest' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsProvider' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/logistics-providers/{providerId}:
    get:
      tags: [LogisticsMaster]
      summary: 查询物流商详情
      operationId: getLogisticsProvider
      parameters: [{ $ref: '#/components/parameters/ProviderId' }]
      responses:
        '200': { description: 物流商详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsProvider' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LogisticsMaster]
      summary: 修改物流商
      operationId: updateLogisticsProvider
      parameters: [{ $ref: '#/components/parameters/ProviderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLogisticsProviderRequest' } } } }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsProvider' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/logistics-channels:
    get:
      tags: [LogisticsMaster]
      summary: 分页查询物流渠道
      operationId: listLogisticsChannels
      responses:
        '200': { description: 渠道分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannelPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [LogisticsMaster]
      summary: 创建物流渠道
      operationId: createLogisticsChannel
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLogisticsChannelRequest' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/logistics-channels/{channelId}:
    get:
      tags: [LogisticsMaster]
      summary: 查询物流渠道详情
      operationId: getLogisticsChannel
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200': { description: 渠道详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannel' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LogisticsMaster]
      summary: 修改物流渠道
      operationId: updateLogisticsChannel
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLogisticsChannelRequest' } } } }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/logistics-channels/{channelId}/service-countries:
    put:
      tags: [LogisticsMaster]
      summary: 替换渠道服务国家
      operationId: replaceLogisticsChannelServiceCountries
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceCountriesRequest' } } } }
      responses:
        '200': { description: 替换成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/logistics-channels/{channelId}/price-rules:
    get:
      tags: [LogisticsMaster]
      summary: 查询渠道已发布价格规则版本
      operationId: listPublishedPriceRules
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200': { description: 已发布规则版本与阶梯, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPriceRuleList' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [LogisticsMaster]
      summary: 创建并发布价格规则版本
      operationId: publishPriceRuleVersion
      parameters: [{ $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishPriceRuleRequest' } } } }
      responses:
        '201': { description: 已发布新价格版本, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPriceRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuoteRuleError' }

  /platform/logistics-channels/{channelId}/price-rules/{priceRuleId}:
    get:
      tags: [LogisticsMaster]
      summary: 查询已发布价格规则及阶梯
      operationId: getPublishedPriceRule
      parameters: [{ $ref: '#/components/parameters/ChannelId' }, { name: priceRuleId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses:
        '200': { description: 已发布价格规则, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPriceRule' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /logistics/channels:
    get:
      tags: [LogisticsMaster]
      summary: 租户分页查询可用公共渠道
      operationId: listAvailableLogisticsChannels
      parameters: [{ name: countryCode, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }]
      responses:
        '200': { description: 启用渠道分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannelPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /logistics/channels/{channelId}:
    get:
      tags: [LogisticsMaster]
      summary: 租户查询可用公共渠道详情
      operationId: getAvailableLogisticsChannel
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200': { description: 启用渠道详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessLogisticsChannel' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /logistics/channels/{channelId}/service-countries:
    get:
      tags: [LogisticsMaster]
      summary: 租户查询可用渠道服务国家
      operationId: getAvailableChannelServiceCountries
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200': { description: 国家编码列表 }
        '404': { $ref: '#/components/responses/NotFound' }
  /logistics/channels/{channelId}/price-rule:
    get:
      tags: [LogisticsMaster]
      summary: 租户查询当前生效价格规则
      operationId: getEffectivePublishedPriceRule
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200': { description: 当前生效已发布规则, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPriceRule' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes:
    get:
      tags: [Quotes]
      summary: 分页查询当前租户报价历史
      operationId: listQuotes
      parameters:
        - name: storeId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: channelId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: status
          in: query
          schema: { type: string, enum: [VALID, EXPIRED, CANCELLED] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: 报价列表 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Quotes]
      summary: 创建报价
      operationId: createQuote
      description: |
        使用商家申报重量、尺寸、目的国家、物流渠道和已发布价格规则计算报价。
        报价创建后金额、计费输入和规则版本不可修改，只允许按生命周期规则失效。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: 报价创建成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/QuoteRuleError'

  /quotes/{quoteId}:
    get:
      tags: [Quotes]
      summary: 查询当前租户报价详情
      operationId: getQuote
      responses:
        '200': { description: 报价详情 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quotes/{quoteId}/validate:
    post:
      tags: [Quotes]
      summary: 校验报价当前是否有效
      operationId: validateQuote
      responses:
        '200': { description: 有效性结果 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes/{quoteId}/shipment-orders:
    post:
      tags: [Orders]
      summary: 基于不可变报价创建物流订单
      operationId: createShipmentOrderFromQuote
      description: 仅当前租户有效且未使用的报价可消费。事务内创建订单、地址、包裹、商品及不可变报价快照；同幂等键返回原订单。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentOrderFromQuoteRequest' }
      responses:
        '201': { description: 订单已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentOrder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuoteRuleError' }

  /orders:
    post:
      tags: [Orders]
      summary: 使用报价创建物流订单
      operationId: createOrder
      description: |
        必须传入有效 quote_id 和 Idempotency-Key。
        包裹申报重量、长宽高必须与报价输入完全一致；服务端生成 package_no、地址快照类型和订单号。
        同一租户、同一幂等键和同一请求内容重复提交时返回原订单结果。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单创建成功，初始状态为 DRAFT
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 查询订单详情
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 订单详情
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/submit:
    post:
      tags: [Orders]
      summary: 提交订单
      operationId: submitOrder
      description: |
        仅允许 DRAFT 进入 PENDING_INBOUND。
        提交请求必须携带 version，并使用订单乐观锁。
        DRAFT 不允许直接执行入库操作。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 提交成功，状态为 PENDING_INBOUND
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: 取消草稿或待入库订单
      operationId: cancelOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderActionRequest' } } } }
      responses:
        '200': { description: 已取消订单, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOrder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{orderId}/inbound:
    post:
      tags: [Warehouse]
      summary: 确认入库
      operationId: confirmInbound
      description: |
        主要由仓库人员触发，只允许 PENDING_INBOUND 进入 INBOUND。
        DRAFT 必须先调用提交订单接口。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 入库成功，状态为 INBOUND
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /orders/{orderId}/measurements:
    post:
      tags: [Warehouse]
      summary: 提交仓库复称
      operationId: submitMeasurement
      description: |
        请求中的重量统一转换为 kg，尺寸统一转换为 cm 后入库。
        version 必填并用于订单乐观锁。仓库实际计费重量取仓库实际重量和仓库实际体积重量的最大值。
        费用上涨是正常业务结果，订单进入 PENDING_PRICE_CONFIRMATION，不返回业务错误。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementRequest'
      responses:
        '200':
          description: 复称处理成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMeasurementResult'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /orders/{orderId}/price-confirmation:
    post:
      tags: [Orders]
      summary: 确认复称后的新费用
      operationId: confirmPrice
      description: |
        商家管理员或商家操作员确认费用上涨后，订单进入 READY_FOR_OUTBOUND。
        客户端不能决定最终费用，服务端必须校验 feeAdjustmentId 属于当前订单和租户、类型为 INCREASE、尚未确认，
        expectedFee 等于 adjustment.after_amount，且订单当前状态为 PENDING_PRICE_CONFIRMATION。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceConfirmationRequest'
      responses:
        '200':
          description: 新费用确认成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'

  /orders/{orderId}/outbound:
    post:
      tags: [Warehouse]
      summary: 确认仓库出库
      operationId: confirmOutbound
      description: |
        主要由仓库人员触发。物流商由订单 channelId 推导，不接受 providerId 入参。
        仅允许 READY_FOR_OUTBOUND 进入 OUTBOUND，并使用订单 version 乐观锁。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundRequest'
      responses:
        '200':
          description: 出库成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOutbound'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /integrations/logistics/{providerCode}/tracking-events:
    post:
      tags: [Tracking]
      summary: 接收物流商轨迹回调
      operationId: receiveTrackingEvents
      security:
        - providerHmac: []
      description: |
        签名为 Base64(HMAC-SHA256(secret, timestamp + "." + rawRequestBody))。
        X-Provider-Timestamp 为 Unix 秒级时间戳，允许与服务端时间偏差不超过 300 秒。
        服务端使用恒定时间比较签名。密钥和完整签名禁止写入日志。
        重复事件返回 202 并将单事件结果标记为 DUPLICATE，不重复产生业务影响、状态推进或审计记录。
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/ProviderTimestamp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingCallbackRequest'
      responses:
        '202':
          description: 回调已接收，重复事件也返回成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTrackingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TrackingSignatureError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/TrackingError'

  /orders/{orderId}/tracking-events:
    get:
      tags: [Tracking]
      summary: 查询订单物流轨迹
      operationId: listTrackingEvents
      description: |
        仅返回 TrackingEventView，不返回 rawPayload、物流商签名或内部处理堆栈。
        按 eventTime 升序展示，迟到事件不得使订单状态回退。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 轨迹分页
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTrackingPage'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /shipment-orders/{orderId}/tracking:
    get:
      tags: [Tracking]
      summary: 查询当前租户订单轨迹
      operationId: listShipmentOrderTracking
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: 按 eventTime、事件ID升序的轨迹列表 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shipment-orders/{orderId}/tracking/status:
    get:
      tags: [Tracking]
      summary: 查询当前租户订单物流状态与最新轨迹
      operationId: getShipmentOrderTrackingStatus
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: 当前状态及最新轨迹摘要 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /billing/import-batches:
    post:
      tags: [Billing]
      summary: 上传 CSV 账单
      operationId: importBillingCsv
      description: |
        第一版只接受统一 CSV 模板。模板必须包含 provider_bill_detail_no。
        系统使用文件摘要和明细业务唯一键防止重复导入。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, providerId]
              properties:
                file:
                  type: string
                  format: binary
                providerId:
                  $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: 账单导入批次已接收
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessBillBatch'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BillConflict'
        '422':
          $ref: '#/components/responses/BillError'

    get:
      tags: [Billing]
      summary: 查询当前租户账单导入批次
      operationId: listBillImportBatches
      parameters: [{ name: providerId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [PROCESSING, PARTIAL_SUCCESS, SUCCESS, FAILED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 账单批次分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillBatchPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /billing/import-batches/{batchId}:
    get:
      tags: [Billing]
      summary: 查询当前租户账单导入批次详情
      operationId: getBillImportBatch
      parameters: [{ name: batchId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 账单批次详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillBatch' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /billing/import-batches/{batchId}/errors:
    get:
      tags: [Billing]
      summary: 查询当前租户账单批次行级错误
      operationId: listBillImportErrors
      parameters: [{ name: batchId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 错误账单明细分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillDetailPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /billing/details:
    get:
      tags: [Billing]
      summary: 查询当前租户账单明细
      operationId: listBillDetails
      parameters: [{ name: batchId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [IMPORTED, MATCHED, ERROR] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 账单明细分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillDetailPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /reconciliations:
    get:
      tags: [Reconciliation]
      summary: 查询当前租户自动生成的对账记录
      operationId: listReconciliations
      parameters: [{ name: orderId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [AUTO_CLOSED, PENDING_CONFIRMATION, CONFIRMED, REJECTED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 对账记录分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliationPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /reconciliations/{reconciliationId}:
    get:
      tags: [Reconciliation]
      summary: 查询当前租户对账记录详情
      operationId: getReconciliation
      parameters: [{ $ref: '#/components/parameters/ReconciliationId' }]
      responses: { '200': { description: 对账记录详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliation' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /reconciliations/{reconciliationId}/confirm:
    post:
      tags: [Reconciliation]
      summary: 财务确认对账差异
      operationId: confirmReconciliationDifference
      description: |
        非零差异必须由财务人员确认后关闭，第一版不支持小额差异自动关闭。
      parameters:
        - $ref: '#/components/parameters/ReconciliationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationConfirmRequest'
      responses:
        '200':
          description: 对账差异确认成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReconciliation'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ReconciliationError'

  /audit-logs:
    get:
      tags: [Audit]

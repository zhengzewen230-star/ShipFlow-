        declaredWeight: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        declaredLength: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        declaredWidth: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        declaredHeight: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        packageCount: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        priceRuleVersion: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        chargeableWeight: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        amount: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }
        currency: { nullable: true, description: 禁止修改；非空返回 ORDER-1007。 }

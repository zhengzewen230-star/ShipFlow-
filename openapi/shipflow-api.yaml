      responses: { '201': { description: 记录创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionHandlingRecord' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /exceptions/{exceptionId}/evidence:

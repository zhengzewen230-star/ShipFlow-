    GuestEstimateLeadPage: { allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/GuestEstimateLead' } } } }] }
    UpdateGuestEstimateLeadStatusRequest: { type: object, required: [status, version], properties: { status: { type: string, enum: [CONTACTING, QUALIFIED, CLOSED] }, handlingRemark: { type: string, maxLength: 500, nullable: true }, version: { type: integer, format: int64, minimum: 0 } } }
    CreateOnboardingApplicationRequest: { type: object, required: [companyName, contactName, businessEmail, contactPhone, countryCode], properties: { companyName: { type: string, maxLength: 128 }, contactName: { type: string, maxLength: 128 }, businessEmail: { type: string, format: email, maxLength: 254 }, contactPhone: { type: string, maxLength: 64 }, countryCode: { type: string, pattern: '^[A-Z]{2}$' } } }
    OnboardingApplication: { type: object, properties: { id: { $ref: '#/components/schemas/Id' }, applicationNo: { type: string }, companyName: { type: string }, contactName: { type: string }, businessEmail: { type: string, format: email }, contactPhone: { type: string }, countryCode: { type: string }, status: { type: string, enum: [PENDING, APPROVED, REJECTED] }, reviewRemark: { type: string, nullable: true }, tenantId: { $ref: '#/components/schemas/Id', nullable: true }, initialUserId: { $ref: '#/components/schemas/Id', nullable: true }, version: { type: integer, format: int64 }, createdAt: { type: string, format: date-time, nullable: true }, reviewedAt: { type: string, format: date-time, nullable: true } } }
    OnboardingPage: { allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OnboardingApplication' } } } }] }
    ApproveOnboardingApplicationRequest: { type: object, required: [tenantCode, adminUsername, reviewRemark, version], properties: { tenantCode: { type: string, maxLength: 64 }, adminUsername: { type: string, maxLength: 128 }, reviewRemark: { type: string, maxLength: 500 }, version: { type: integer, format: int64, minimum: 0 } } }
    RejectOnboardingApplicationRequest: { type: object, required: [reviewRemark, version], properties: { reviewRemark: { type: string, maxLength: 500 }, version: { type: integer, format: int64, minimum: 0 } } }

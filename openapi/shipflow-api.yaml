openapi: 3.0.3
info:
  title: ShipFlow API
  version: 1.0.0
  description: |
    ShipFlow 跨境物流履约与费用结算系统第一版 API 契约。
    所有租户业务接口从 JWT 身份上下文获取 tenant_id，不接受调用方任意传入。
servers:
  - url: /api/v1
    description: ShipFlow API v1
tags:
  - name: Auth
    description: 认证与当前用户
  - name: Tenant
    description: 平台租户管理
  - name: Store
    description: 当前租户店铺管理
  - name: User
    description: 当前租户用户管理
  - name: RBAC
    description: 角色与权限管理
  - name: LogisticsMaster
    description: 平台物流商、渠道和价格规则主数据
  - name: Quotes
    description: 运费报价
  - name: Orders
    description: 物流订单
  - name: Warehouse
    description: 仓库履约操作
  - name: Tracking
    description: 物流轨迹
  - name: Billing
    description: 账单导入
  - name: Reconciliation
    description: 费用对账
  - name: Onboarding
    description: Guest estimate leads and platform merchant onboarding review
security:
  - bearerAuth: []
paths:
  /public/estimate-requests:
    post:
      tags: [Onboarding]
      summary: Submit a guest estimate lead (not a formal quote)
      operationId: createGuestEstimateRequest
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/XsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGuestEstimateRequest' } } } }
      responses: { '201': { description: Lead accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessGuestEstimate' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/CsrfError' }, '409': { $ref: '#/components/responses/Conflict' } }
  /public/onboarding-applications:
    post:
      tags: [Onboarding]
      summary: Submit merchant onboarding application
      operationId: createOnboardingApplication
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/XsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOnboardingApplicationRequest' } } } }
      responses: { '201': { description: Application pending platform review, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOnboardingApplication' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/CsrfError' }, '409': { $ref: '#/components/responses/Conflict' } }
  /public/onboarding-activations:
    post:
      tags: [Onboarding]
      summary: Activate first administrator with one-time invitation
      operationId: activateOnboardingAdministrator
      security: []
      parameters: [{ $ref: '#/components/parameters/XsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationRequest' } } } }
      responses: { '200': { description: Administrator activated, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessActivation' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/CsrfError' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/BadRequest' } }
  /platform/onboarding-applications:
    get:
      tags: [Onboarding]
      summary: List onboarding applications for platform reviewers
      operationId: listOnboardingApplications
      description: PLATFORM scope plus tenant:manage only; tenants cannot read leads or applications.
      parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Application page, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOnboardingPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /platform/onboarding-applications/{applicationId}:
    get:
      tags: [Onboarding]
      summary: Get an onboarding application
      operationId: getOnboardingApplication
      description: PLATFORM scope plus tenant:manage only. Contact data is returned only to authorised platform reviewers.
      parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: Onboarding application, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOnboardingApplication' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /platform/onboarding-applications/{applicationId}/approve:
    post:
      tags: [Onboarding]
      summary: Approve application and issue activation invitation
      operationId: approveOnboardingApplication
      description: PLATFORM scope plus tenant:manage only. The opaque token is returned once for secure out-of-band delivery; only its hash is persisted.
      parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/XsrfHeader' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApproveOnboardingApplicationRequest' } } } }
      responses: { '200': { description: Application approved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOnboardingApproval' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /platform/onboarding-applications/{applicationId}/reject:
    post:
      tags: [Onboarding]
      summary: Reject onboarding application
      operationId: rejectOnboardingApplication
      parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/XsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectOnboardingApplicationRequest' } } } }
      responses: { '200': { description: Application rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOnboardingApplication' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /platform/guest-estimate-leads:
    get:
      tags: [Onboarding]
      summary: List guest estimate leads for platform reviewers
      operationId: listGuestEstimateLeads
      description: PLATFORM scope plus tenant:manage only. Leads are platform-owned, never tenant quotes or orders.
      parameters: [{ name: status, in: query, schema: { type: string, enum: [RECEIVED, CONTACTING, QUALIFIED, CLOSED] } }, { name: keyword, in: query, schema: { type: string, maxLength: 128 } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Guest estimate lead page, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessGuestEstimateLeadPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /platform/guest-estimate-leads/{leadId}:
    get:
      tags: [Onboarding]
      summary: Get a guest estimate lead
      operationId: getGuestEstimateLead
      description: PLATFORM scope plus tenant:manage only.
      parameters: [{ name: leadId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: Guest estimate lead, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessGuestEstimateLead' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /platform/guest-estimate-leads/{leadId}/status:
    patch:
      tags: [Onboarding]
      summary: Update guest estimate lead handling status
      operationId: updateGuestEstimateLeadStatus
      description: PLATFORM scope plus tenant:manage only. Uses optimistic version control and writes a platform audit event.
      parameters: [{ name: leadId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/XsrfHeader' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGuestEstimateLeadStatusRequest' } } } }
      responses: { '200': { description: Updated lead, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessGuestEstimateLead' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /auth/csrf:
    get:
      tags: [Auth]
      summary: 获取 CSRF Token
      operationId: getCsrfToken
      security: []
      description: |
        匿名获取 CSRF Token。服务端使用 Spring Security CookieCsrfTokenRepository
        设置可由前端读取的 XSRF-TOKEN Cookie，不返回 Refresh Token。
      responses:
        '204':
          description: CSRF Cookie 已设置
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/XsrfCookie'

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLogin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/CsrfError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 Token
      operationId: refreshToken
      description: |
        从 HttpOnly Refresh Cookie 读取令牌，校验 CSRF 双提交请求头并执行 Refresh Token 轮换。
        客户端必须串行刷新；ROTATED Token 重复使用会撤销整个 family。
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      responses:
        '200':
          description: 刷新成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLogin'
        '401':
          $ref: '#/components/responses/AuthError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      operationId: logout
      description: |
        撤销当前 Refresh Token family 并清除 Refresh/XSRF Cookie。
        仅通过 Refresh Cookie 定位 family；Access Token 只是可选审计身份，不能单独定位或撤销 family。
        Refresh Cookie 已撤销、过期或不存在时保持幂等成功，不泄露具体原因。
        不要求 auth:logout 权限。logout-all 留待后续版本。
      security:
        - bearerAuth: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/XsrfHeader'
      responses:
        '200':
          description: 退出成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ClearedAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '403':
          $ref: '#/components/responses/CsrfError'

  /users/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCurrentUser'
        '401':
          $ref: '#/components/responses/AuthError'

  /platform/tenants:
    post:
      tags: [Tenant]
      summary: 创建租户和初始管理员
      operationId: createTenant
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: 租户与初始管理员已在同一事务创建。
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTenant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Tenant]
      summary: 分页查询租户
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TenantStatus' }
        - name: tenantCode
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 平台可见租户分页。
          headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenantPage' } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/tenants/{tenantId}:
    get:
      tags: [Tenant]
      summary: 查询租户详情
      operationId: getTenant
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      responses:
        '200': { description: 租户详情, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenant]
      summary: 修改租户基础信息
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTenantRequest' } } }
      responses:
        '200': { description: 更新后租户, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /platform/tenants/{tenantId}/status:
    post:
      tags: [Tenant]
      summary: 启用或停用租户
      operationId: changeTenantStatus
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } }
      responses:
        '200': { description: 新租户状态, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTenant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /stores:
    post:
      tags: [Store]
      summary: 创建当前租户店铺
      operationId: createStore
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStoreRequest' } } }
      responses:
        '201': { description: 店铺已创建, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Store]
      summary: 查询当前租户店铺
      operationId: listStores
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: storeCode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: storeName
          in: query
          schema: { type: string, maxLength: 128 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActiveStatus' }
        - name: platformCode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [storeCode, storeName, platformCode, status, updatedAt], default: updatedAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        '200': { description: 当前租户店铺分页列表, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStorePage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stores/{storeId}:
    get:
      tags: [Store]
      summary: 查询当前租户店铺详情
      operationId: getStore
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200': { description: 店铺详情（平台账号脱敏，含历史订单数量和审计摘要）, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreDetail' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Store]
      summary: 修改当前租户店铺
      operationId: updateStore
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStoreRequest' } } }
      responses:
        '200': { description: 更新后店铺, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStore' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /stores/{storeId}/default-address:
    get:
      tags: [Store]
      summary: 查询店铺默认发货地址
      operationId: getStoreDefaultAddress
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: 默认地址或未配置, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreAddress' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Store]
      summary: 更新店铺默认发货地址
      operationId: updateStoreDefaultAddress
      parameters: [{ $ref: '#/components/parameters/StoreId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStoreAddressRequest' } } } }
      responses:
        '200': { description: 默认地址已更新, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreAddress' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /stores/{storeId}/logistics-channels:
    get:
      tags: [Store]
      summary: 查询店铺已绑定物流渠道
      operationId: listStoreLogisticsChannels
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: 店铺渠道列表, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreChannels' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stores/{storeId}/default-logistics-channel:
    put:
      tags: [Store]
      summary: 设置店铺默认物流渠道
      operationId: setStoreDefaultLogisticsChannel
      parameters: [{ $ref: '#/components/parameters/StoreId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetDefaultStoreChannelRequest' } } } }
      responses:
        '200': { description: 默认渠道已更新, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessStoreChannels' } } } }

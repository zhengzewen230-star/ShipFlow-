    post:
      tags: [Quotes]
      summary: 校验报价当前是否有效
      operationId: validateQuote
      responses:
        '200': { description: 有效性结果 }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes/{quoteId}/shipment-orders:
    post:
      tags: [Orders]
      summary: 基于不可变报价创建物流订单
      operationId: createShipmentOrderFromQuote
      description: 仅当前租户有效且未使用的报价可消费。事务内创建订单、地址、包裹、商品及不可变报价快照；同幂等键返回原订单。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentOrderFromQuoteRequest' }
      responses:
        '201': { description: 订单已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentOrder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuoteRuleError' }

  /orders:
    get:
      tags: [Orders]
      summary: 分页查询当前租户物流订单
      operationId: listShipmentOrders
      description: |
        仅查询 JWT tenant_id 对应租户的订单，需要 `scope:TENANT`。
        status 按后端订单状态过滤；storeId 按当前租户店铺过滤。
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: workbenchFilter
          in: query
          description: 仅工作台使用；按当前调用方可见店铺过滤。
          schema: { type: string, enum: [PENDING_FEE_CONFIRMATION, MISSING_ADDRESS] }
        - name: storeId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - { name: orderNo, in: query, schema: { type: string, maxLength: 64 } }
        - { name: destinationCountry, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: destination, in: query, description: destinationCountry 的兼容别名, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: channelId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: logisticsChannelId, in: query, description: channelId 的兼容别名, schema: { $ref: '#/components/schemas/Id' } }
        - { name: trackingNo, in: query, schema: { type: string, maxLength: 128 } }
        - { name: sfTrackingNo, in: query, description: trackingNo 的兼容别名, schema: { type: string, maxLength: 128 } }
        - { name: createdFrom, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: createdTo, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, orderNo, status, destinationCountry, channelId, estimatedFee], default: createdAt } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前租户订单分页
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessShipmentOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/export:
    get:
      tags: [Orders]
      summary: 导出当前调用方可见订单
      operationId: exportShipmentOrders
      parameters:
        - { name: ids, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Id' }, maxItems: 1000 } }
        - { name: orderNo, in: query, schema: { type: string, maxLength: 64 } }
        - { name: storeId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: destinationCountry, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: channelId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: trackingNo, in: query, schema: { type: string, maxLength: 128 } }
        - { name: createdFrom, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: createdTo, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
      responses:
        '200': { description: UTF-8 BOM CSV, content: { text/csv: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 查询订单详情
      operationId: getOrder
      description: 仅查询 JWT tenant_id 对应租户的订单，需要 `scope:TENANT`。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 订单详情
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessShipmentOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Orders]
      summary: 更新草稿订单的非计价信息
      operationId: updateDraftShipmentOrder
      description: |
        仅允许当前租户的 DRAFT 订单更新收件地址、寄件地址、商品明细和备注，需要 `scope:TENANT`。
        渠道、目的国家、申报重量尺寸、包裹数、价格规则版本、计费重量、金额、币种和报价快照均禁止修改；传入这些字段返回 422。
        version 是必填字段并用于订单乐观锁；版本过期或订单已不再是 DRAFT 时返回 409。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentOrderRequest'
      responses:
        '200': { description: 更新后的草稿订单, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentOrder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/OrderRuleError' }

  /orders/{orderId}/submit:
    post:
      tags: [Orders]
      summary: 提交订单
      operationId: submitOrder
      description: |
        仅允许 DRAFT 进入 PENDING_INBOUND。
        提交请求必须携带 version，并使用订单乐观锁。
        DRAFT 不允许直接执行入库操作。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderActionRequest'
      responses:
        '200':
          description: 提交成功，状态为 PENDING_INBOUND
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessShipmentOrder'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: 取消草稿或待入库订单
      operationId: cancelOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderActionRequest' } } } }
      responses:
        '200': { description: 已取消订单, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentOrder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{orderId}/inbound:
    post:
      tags: [Warehouse]
      summary: 确认入库
      operationId: confirmInbound
      description: |
        主要由仓库人员触发，只允许 PENDING_INBOUND 进入 INBOUND。
        DRAFT 必须先调用提交订单接口。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 入库成功，状态为 INBOUND
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessWarehouseResult'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /orders/{orderId}/measurements:
    post:
      tags: [Warehouse]
      summary: 提交仓库复称
      operationId: submitMeasurement
      description: |
        请求中的重量统一转换为 kg，尺寸统一转换为 cm 后入库。
        version 必填并用于订单乐观锁。仓库实际计费重量取仓库实际重量和仓库实际体积重量的最大值。
        费用上涨是正常业务结果，订单进入 PENDING_PRICE_CONFIRMATION，不返回业务错误。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementRequest'
      responses:
        '200':
          description: 复称处理成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessWarehouseResult'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /orders/{orderId}/price-confirmation:
    get:
      tags: [Orders]
      summary: 查询订单费用确认状态
      operationId: getPriceConfirmation
      description: |
        返回订单费用调整、申请状态和 UTC ISO-8601 时间字段。服务端按 tenant_id、store_id、角色和资源归属过滤。
        数据库存储时间统一为 UTC；前端展示和业务“今日”统计统一转换为 Asia/Shanghai。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 费用确认状态
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPriceConfirmation'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'


        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Orders]
      summary: 确认复称后的新费用
      operationId: confirmPrice
      description: |
        财务人员最终确认费用，租户管理员可作为备用审批人；商家业务员只能提交申请，不能最终确认。
        客户端不能决定最终费用，服务端必须校验 feeAdjustmentId 属于当前订单和租户、类型为 INCREASE、尚未确认，
        expectedFee 等于 adjustment.after_amount，且订单当前状态为 PENDING_PRICE_CONFIRMATION。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceConfirmationRequest'
      responses:
        '200':
          description: 新费用确认成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPriceConfirmation'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'
  /orders/{orderId}/price-confirmation-requests:
    post:
      tags: [Orders]
      summary: 提交费用确认申请
      operationId: submitPriceConfirmationRequest
      description: 商家业务员只能在被授权店铺内提交申请；申请不改变订单状态，订单仍为 PENDING_PRICE_CONFIRMATION。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceConfirmationRequest'
      responses:
        '200':
          description: 费用确认申请已提交
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPriceConfirmation'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OrderRuleError'

  /orders/{orderId}/outbound:
    post:
      tags: [Warehouse]
      summary: 确认仓库出库
      operationId: confirmOutbound
      description: |
        主要由仓库人员触发。物流商由订单 channelId 推导，不接受 providerId 入参。
        仅允许 READY_FOR_OUTBOUND 进入 OUTBOUND，并使用订单 version 乐观锁。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundRequest'
      responses:
        '200':
          description: 出库成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessWarehouseResult'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/WarehouseError'

  /integrations/logistics/{providerCode}/tracking-events:
    post:
      tags: [Tracking]
      summary: 接收物流商轨迹回调
      operationId: receiveTrackingEvents
      security:
        - providerHmac: []
      description: |
        Server-to-server 专用回调，不供浏览器、Vue 前端或普通 Bearer Token 客户端调用。
        调用方必须是已配置共享密钥的物流商服务器，并同时提供 X-Provider-Signature 与 X-Provider-Timestamp。
        签名为 Base64(HMAC-SHA256(secret, timestamp + "." + rawRequestBody))。
        X-Provider-Timestamp 为 Unix 秒级时间戳，允许与服务端时间偏差不超过 300 秒。
        服务端使用恒定时间比较签名。密钥和完整签名禁止写入日志。
        重复事件返回 202 并将单事件结果标记为 DUPLICATE，不重复产生业务影响、状态推进或审计记录。
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/ProviderTimestamp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingCallbackRequest'
      responses:
        '202':
          description: 回调已接收，重复事件也返回成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTrackingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TrackingSignatureError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/TrackingError'

  /orders/{orderId}/tracking-events:
    get:
      tags: [Tracking]
      summary: 查询订单物流轨迹
      operationId: listTrackingEvents
      description: |
        仅返回 TrackingEventView，不返回 rawPayload、物流商签名或内部处理堆栈。
        按 eventTime 升序展示，迟到事件不得使订单状态回退。
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 轨迹分页
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTrackingPage'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /shipment-orders/{orderId}/tracking:
    get:
      tags: [Tracking]
      summary: 查询当前租户订单轨迹
      operationId: listShipmentOrderTracking
      description: 仅供当前租户的已认证用户查询；返回只读轨迹 DTO，不包含原始回调载荷或签名。
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: 按 eventTime、事件ID升序的轨迹列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentTrackingList' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shipment-orders/{orderId}/tracking/status:
    get:
      tags: [Tracking]
      summary: 查询当前租户订单物流状态与最新轨迹
      operationId: getShipmentOrderTrackingStatus
      description: 仅供当前租户的已认证用户查询订单当前状态及最新一条只读轨迹。
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: 当前状态及最新轨迹摘要, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentTrackingStatus' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderNo}/tracking:
    get:
      tags: [Tracking]
      summary: 按订单号或顺丰运单号查询全链路轨迹
      operationId: getShipmentTrackingTimeline
      description: 返回订单创建、仓内作业、顺丰回调及沙箱推演节点，按发生时间倒序排列。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
          description: 业务订单号或顺丰运单号
      responses:
        '200': { description: 全链路轨迹时间轴, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessShipmentTrackingTimeline' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracking-events:
    get:
      tags: [Tracking]
      summary: 按订单、运单、状态和事件时间查询可见轨迹
      operationId: searchTrackingEvents
      parameters:
        - { name: orderNo, in: query, schema: { type: string, maxLength: 64 } }
        - { name: trackingNo, in: query, schema: { type: string, maxLength: 128 } }
        - { name: sfTrackingNo, in: query, description: trackingNo 的兼容别名, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, schema: { type: string, maxLength: 64 } }
        - { name: statusCode, in: query, description: status 的兼容别名, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200': { description: 已脱敏轨迹事件分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessTrackingEventListPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TrackingError' }

  /billing/import-batches:
    post:
      tags: [Billing]
      summary: 上传 CSV 账单
      operationId: importBillingCsv
      description: |
        第一版只接受统一 CSV 模板。模板必须包含 provider_bill_detail_no。
        系统同时使用文件内容 SHA-256 摘要和 Idempotency-Key 防止重复导入：相同租户、物流商和文件内容即使更换幂等键也不会再次导入；同一幂等键只能绑定同一物流商和文件内容，不同请求体复用幂等键返回 409。文件名不参与重复判断。数据库时间按 UTC 存储，时间字段按 UTC ISO-8601 返回。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, providerId]
              properties:
                file:
                  type: string
                  format: binary
                providerId:
                  $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: 账单导入批次已接收
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessBillBatch'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BillConflict'
        '422':
          $ref: '#/components/responses/BillError'

    get:
      tags: [Billing]
      summary: 查询当前租户账单导入批次
      operationId: listBillImportBatches
      parameters: [{ name: providerId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [PROCESSING, PARTIAL_SUCCESS, SUCCESS, FAILED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 账单批次分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillBatchPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /billing/import-batches/{batchId}:
    get:
      tags: [Billing]
      summary: 查询当前租户账单导入批次详情
      operationId: getBillImportBatch
      parameters: [{ name: batchId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 账单批次详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillBatch' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /billing/import-batches/{batchId}/errors:
    get:
      tags: [Billing]
      summary: 查询当前租户账单批次行级错误
      operationId: listBillImportErrors
      parameters: [{ name: batchId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 错误账单明细分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillDetailPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /billing/details:
    get:
      tags: [Billing]
      summary: 查询当前租户账单明细
      operationId: listBillDetails
      parameters: [{ name: batchId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [IMPORTED, MATCHED, ERROR] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 账单明细分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessBillDetailPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /reconciliations:
    get:
      tags: [Reconciliation]
      summary: 查询当前租户自动生成的对账记录
      operationId: listReconciliations
      parameters: [{ name: orderId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [AUTO_CLOSED, PENDING_CONFIRMATION, CONFIRMED, REJECTED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 对账记录分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliationPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /reconciliations/{reconciliationId}:
    get:
      tags: [Reconciliation]
      summary: 查询当前租户对账记录详情
      operationId: getReconciliation
      parameters: [{ $ref: '#/components/parameters/ReconciliationId' }]
      responses: { '200': { description: 对账记录详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliation' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /reconciliations/{reconciliationId}/confirm:
    post:
      tags: [Reconciliation]
      summary: 财务确认对账差异
      operationId: confirmReconciliationDifference
      description: |
        非零差异必须由财务人员确认后关闭，第一版不支持小额差异自动关闭。
      parameters:
        - $ref: '#/components/parameters/ReconciliationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationConfirmRequest'
      responses:
        '200':
          description: 对账差异确认成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReconciliation'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ReconciliationError'

  /reconciliations/{reconciliationId}/reject:
    post:
      tags: [Reconciliation]
      summary: 驳回非零差异对账
      operationId: rejectReconciliationDifference
      parameters: [{ $ref: '#/components/parameters/ReconciliationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationActionRequest' } } } }
      responses: { '200': { description: 驳回成功, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliation' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ReconciliationError' } }

  /reconciliations/{reconciliationId}/comments:
    post:
      tags: [Reconciliation]
      summary: 补充对账处理说明
      operationId: addReconciliationComment
      parameters: [{ $ref: '#/components/parameters/ReconciliationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationActionRequest' } } } }
      responses: { '200': { description: 说明保存成功, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessReconciliation' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ReconciliationError' } }

  /audit-logs:

        - { name: sortField, in: query, schema: { type: string, enum: [channelCode, channelName, providerName, status, effectiveFrom, updatedAt], default: updatedAt } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200': { description: 公开渠道分页，不含价格阶梯、成本或供应商配置, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessPublicLogisticsChannelPage' } } } }

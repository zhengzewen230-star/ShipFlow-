      operationId: listTenantAuditLogs
      parameters: [{ name: resourceType, in: query, schema: { type: string } }, { name: resourceId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: action, in: query, schema: { type: string } }, { name: operatorId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: from, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }, { name: to, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 脱敏审计日志分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessAuditLogPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /audit-logs/{auditId}:
    get:
      tags: [Audit]
      summary: 查询当前租户审计日志详情
      operationId: getTenantAuditLog
      parameters: [{ name: auditId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 脱敏审计日志详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessAuditLog' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /platform/audit-logs:
    get:

      responses: { '200': { description: 指定租户脱敏审计日志分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessAuditLogPage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /platform/audit-logs/{auditId}:
    get:
      tags: [Audit]
      summary: 平台管理员查询指定租户审计日志详情
      operationId: getPlatformTenantAuditLog
      parameters: [{ name: auditId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { name: tenantId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 指定租户脱敏审计日志详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessAuditLog' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /exceptions:
    get:
      tags: [Exceptions]
      summary: 查询当前租户异常单
      operationId: listExceptionCases
      parameters: [{ name: orderId, in: query, schema: { $ref: '#/components/schemas/Id' } }, { name: status, in: query, schema: { type: string, enum: [OPEN, PROCESSING, RESOLVED, CLOSED] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: 异常单分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCasePage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /exceptions/{exceptionId}:
    get:
      tags: [Exceptions]
      summary: 查询当前租户异常单详情
      operationId: getExceptionCase
      parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 异常单详情及索赔摘要, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCase' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /orders/{orderId}/exceptions:
    post:
      tags: [Exceptions]
      summary: 从订单或其轨迹事件创建异常单
      operationId: createExceptionCase
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExceptionRequest' } } } }
      responses: { '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCase' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ExceptionClaimError' } }
  /exceptions/{exceptionId}/assign:
    post:
      tags: [Exceptions]
      summary: 分派异常单并从 OPEN 进入 PROCESSING
      operationId: assignExceptionCase
      parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignExceptionRequest' } } } }
      responses: { '200': { description: 分派成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCase' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /exceptions/{exceptionId}/status:
    post:
      tags: [Exceptions]
      summary: 解决或关闭异常单
      operationId: transitionExceptionCase
      description: 仅允许 PROCESSING 到 RESOLVED、RESOLVED 到 CLOSED。
      parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionStatusRequest' } } } }
      responses: { '200': { description: 状态推进成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCase' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /exceptions/{exceptionId}/claim:
    post:
      tags: [Exceptions]
      summary: 为已解决且符合条件的异常单创建索赔
      operationId: createClaim
      parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClaimRequest' } } } }
      responses: { '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ExceptionClaimError' } }
  /claims/{claimId}:
    get:
      tags: [Exceptions]
      summary: 查询当前租户索赔详情
      operationId: getClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 索赔详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /claims/{claimId}/submit:
    post:
      tags: [Exceptions]
      summary: 提交索赔
      operationId: submitClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimActionRequest' } } } }
      responses: { '200': { description: 提交成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /claims/{claimId}/result:
    post:
      tags: [Exceptions]
      summary: 审核通过或驳回索赔
      operationId: resolveClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResultRequest' } } } }
      responses: { '200': { description: 审核完成, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /operations/summary:
    get:
      tags: [Operations]
      summary: 查询当前租户订单履约概览
      operationId: getOperationsSummary
      responses: { '200': { description: 各订单状态数量, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsSummary' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /operations/todos:
    get:
      tags: [Operations]
      summary: 查询当前租户跨域待办汇总
      operationId: getOperationsTodos
      responses: { '200': { description: 价格、对账、异常和索赔待办数量, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsTodos' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /claims/{claimId}/close:
    post:
      tags: [Exceptions]
      summary: 关闭已审核索赔
      operationId: closeClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimActionRequest' } } } }
      responses: { '200': { description: 关闭成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: REFRESH_TOKEN
      description: HttpOnly Refresh Token Cookie；客户端不可读取。
    providerHmac:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Base64 编码的 HMAC-SHA256 签名，签名原文为 timestamp + "." + rawRequestBody。
  headers:
    TraceId:
      description: 与响应体 traceId 一致的链路追踪 ID。
      schema:
        type: string
    NoStore:
      description: 禁止缓存认证凭证相关响应。
      schema:
        type: string
        enum: [no-store]
        default: no-store
    WWWAuthenticate:
      description: RFC 6750 Bearer 认证挑战；具体错误详情不在 Header 中泄露敏感信息。
      schema:
        type: string
        example: Bearer
    AuthCookies:
      description: Set-Cookie 下发 Refresh Token 和 XSRF-TOKEN。Refresh Cookie 使用 HttpOnly、Secure（生产）、SameSite=Strict、明确 Path 和 Max-Age=2592000。
      schema:
        type: string
    XsrfCookie:
      description: Set-Cookie 下发可读取的 XSRF-TOKEN。使用 Secure（生产）、SameSite=Strict、明确 Path 和 Max-Age=2592000，不设置 HttpOnly 和 Domain。
      schema:
        type: string
    ClearedAuthCookies:
      description: Set-Cookie 将 Refresh Token 和 XSRF-TOKEN 设置为过期，以清除 Cookie。
      schema:
        type: string
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReconciliationId:
      name: reconciliationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProviderCode:
      name: providerCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ProviderTimestamp:
      name: X-Provider-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10}$'
        example: '1785643200'
    XsrfCookie:
      name: XSRF-TOKEN
      in: cookie
      required: true
      description: 可由前端读取的 CSRF Cookie；不得设置 HttpOnly。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    XsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 必须与 XSRF-TOKEN Cookie 一致，由 CookieCsrfTokenRepository 校验。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 请求参数或格式错误。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthError:
      description: 未登录、Token 无效或已过期。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CsrfError:
      description: CSRF Cookie 与 X-XSRF-TOKEN 请求头缺失或不匹配。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 权限不足或跨租户访问。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等、乐观锁或订单状态冲突。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    QuoteRuleError:
      description: 报价业务规则校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OrderRuleError:
      description: 订单业务规则校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    WarehouseError:
      description: 仓库业务规则校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TrackingSignatureError:
      description: 轨迹回调签名或时间戳校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TrackingError:
      description: 轨迹业务处理失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExceptionClaimError:
      description: 异常或索赔业务前置条件不满足。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BillConflict:
      description: 账单文件或账单明细重复。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BillError:
      description: CSV 格式或账单业务校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReconciliationError:
      description: 对账业务校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      example: '10001'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '58.00'
      description: 非负金额，JSON 中使用字符串。
    SignedMoney:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      example: '-2.50'
      description: 可为负数的金额，JSON 中使用字符串。
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      example: JP
      description: 大写 ISO 3166-1 alpha-2 国家编码。
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: USD
      description: 大写 ISO 4217 三位币种编码。
    Weight:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      example: '1.500'
      description: 重量，统一使用 kg，JSON 中使用字符串。
    Dimension:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      example: '20.000'
      description: 尺寸，统一使用 cm，JSON 中使用字符串。
    UtcDateTime:
      type: string
      format: date-time
      example: '2026-08-02T10:30:00.000Z'
      description: UTC ISO-8601 时间。
    TemporaryPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$'
      description: 仅用于首次设置密码，服务端使用 BCrypt 保存，不保存或返回明文。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
        tenantCode:
          type: string
          maxLength: 64
          nullable: true
          description: 为空时只匹配平台用户，非空时只匹配指定租户用户。
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        userId:
          $ref: '#/components/schemas/Id'
        tenantId:
          $ref: '#/components/schemas/Id'
    CurrentUserView:
      type: object
      required: [userId, username, scope]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        displayName:
          type: string
        scope:
          type: string
          enum: [PLATFORM, TENANT]
        tenantId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
    ApiSuccessCurrentUser:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUserView'
    ApiSuccess:
      type: object
      required: [success, traceId, data]
      properties:
        success:
          type: boolean
          enum: [true]
        traceId:
          type: string
        message:
          type: string
          example: OK
        data: {}
    ApiSuccessLogin:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'
    ApiError:
      type: object
      required: [success, traceId, error]
      properties:
        success:
          type: boolean
          enum: [false]
        traceId:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: ORDER-1001
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
    Quote:
      type: object
      required: [id, quoteNo, channelId, destinationCountry, declaredWeight, declaredChargeableWeight, amount, currency, feeDetail, validTo]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        quoteNo:
          type: string
        channelId:
          $ref: '#/components/schemas/Id'
        destinationCountry:
          $ref: '#/components/schemas/CountryCode'
        ruleVersionNo:
          type: integer
          minimum: 1
        declaredWeight:
          $ref: '#/components/schemas/Weight'
        declaredChargeableWeight:
          $ref: '#/components/schemas/Weight'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        feeDetail:
          type: object
          additionalProperties: true
        validFrom:
          $ref: '#/components/schemas/UtcDateTime'
        validTo:
          $ref: '#/components/schemas/UtcDateTime'
        status:
          type: string
          enum: [VALID, EXPIRED, CANCELLED]
        version:
          type: integer
          format: int64
    CreateQuoteRequest:
      type: object
      required: [storeId, channelId, declaredWeight, declaredLength, declaredWidth, declaredHeight, destinationCountry]
      properties:
        storeId:
          $ref: '#/components/schemas/Id'
        channelId:
          $ref: '#/components/schemas/Id'
        declaredWeight:
          $ref: '#/components/schemas/Weight'
        declaredLength:
          $ref: '#/components/schemas/Dimension'
        declaredWidth:
          $ref: '#/components/schemas/Dimension'
        declaredHeight:
          $ref: '#/components/schemas/Dimension'
        destinationCountry:
          $ref: '#/components/schemas/CountryCode'
    ApiSuccessQuote:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Quote'
    QuotePage:
      type: object
      required: [page, pageSize, total, totalPages, items]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Quote' }
    QuoteValidation:
      type: object
      required: [quoteId, exists, expired, canCreateOrder, reason]
      properties:
        quoteId: { $ref: '#/components/schemas/Id' }
        exists: { type: boolean }
        expired: { type: boolean }
        canCreateOrder: { type: boolean }
        reason: { type: string, enum: [AVAILABLE, EXPIRED, CANCELLED, ALREADY_USED] }
    ApiSuccessQuotePage:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/QuotePage' }
    ApiSuccessQuoteValidation:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/QuoteValidation' }
    Address:
      type: object
      required: [contactName, phone, countryCode, city, addressLine1, postalCode]
      properties:
        contactName:
          type: string
        companyName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        stateProvince:
          type: string
        city:
          type: string
        district:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        postalCode:
          type: string
    Item:
      type: object
      required: [itemNo, productName, productNameEn, quantity, unitPrice, currency, declaredValue]
      properties:
        itemNo:
          type: integer
          minimum: 1
        productName:
          type: string
        productNameEn:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        declaredValue:
          $ref: '#/components/schemas/Money'
        sku:
          type: string
        material:
          type: string
        originCountry:
          $ref: '#/components/schemas/CountryCode'
    Package:
      type: object
      required: [declaredWeight, declaredLength, declaredWidth, declaredHeight, items]
      properties:
        declaredWeight:
          $ref: '#/components/schemas/Weight'
        declaredLength:
          $ref: '#/components/schemas/Dimension'
        declaredWidth:
          $ref: '#/components/schemas/Dimension'
        declaredHeight:
          $ref: '#/components/schemas/Dimension'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Item'
    CreateOrderRequest:
      type: object
      required: [quoteId, originCountry, destinationCountry, sender, receiver, package]
      description: 服务端根据字段位置生成 SENDER/RECEIVER 地址类型、package_no 和订单号，并校验包裹申报数据与报价完全一致。
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        originCountry:
          $ref: '#/components/schemas/CountryCode'
        destinationCountry:
          $ref: '#/components/schemas/CountryCode'
        sender:
          $ref: '#/components/schemas/Address'
        receiver:
          $ref: '#/components/schemas/Address'
        package:
          $ref: '#/components/schemas/Package'
    CreateShipmentOrderFromQuoteRequest:
      type: object
      required: [senderAddress, receiverAddress, items]
      properties:
        senderAddress: { $ref: '#/components/schemas/Address' }
        receiverAddress: { $ref: '#/components/schemas/Address' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Item' }
    ShipmentOrder:
      type: object
      required: [id, orderNo, quoteId, status, estimatedFee, currency, chargeableWeight, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderNo: { type: string }
        quoteId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [DRAFT] }
        estimatedFee: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        chargeableWeight: { $ref: '#/components/schemas/Weight' }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
    ApiSuccessShipmentOrder:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ShipmentOrder' }
    Order:
      type: object
      required: [id, orderNo, quoteId, currentStatus, estimatedFee, currentFee, currency, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        orderNo:
          type: string
        quoteId:
          $ref: '#/components/schemas/Id'
        currentStatus:
          $ref: '#/components/schemas/OrderStatus'
        estimatedFee:
          $ref: '#/components/schemas/Money'
        currentFee:
          $ref: '#/components/schemas/Money'
        confirmedFee:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        version:
          type: integer
          format: int64
    OrderStatus:
      type: string
      enum: [DRAFT, PENDING_INBOUND, INBOUND, PENDING_PRICE_CONFIRMATION, READY_FOR_OUTBOUND, OUTBOUND, IN_TRANSIT, DELIVERED, CANCELLED, RETURNED, LOST]
    ApiSuccessOrder:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Order'
    VersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    MeasurementRequest:
      type: object
      required: [actualWeight, actualLength, actualWidth, actualHeight, measuredAt, version]
      properties:
        actualWeight:
          $ref: '#/components/schemas/Weight'
        actualLength:
          $ref: '#/components/schemas/Dimension'
        actualWidth:
          $ref: '#/components/schemas/Dimension'
        actualHeight:
          $ref: '#/components/schemas/Dimension'
        measuredAt:
          $ref: '#/components/schemas/UtcDateTime'
        version:
          type: integer
          format: int64
          minimum: 0
    MeasurementResult:
      type: object
      required: [measurementId, actualChargeableWeight, feeChangeType, nextStatus]
      properties:
        measurementId:
          $ref: '#/components/schemas/Id'
        actualChargeableWeight:
          $ref: '#/components/schemas/Weight'
        previousFee:
          $ref: '#/components/schemas/Money'
        currentFee:
          $ref: '#/components/schemas/Money'
        feeChangeType:
          type: string
          enum: [UNCHANGED, DECREASE, INCREASE]
        nextStatus:
          $ref: '#/components/schemas/OrderStatus'
    ApiSuccessMeasurementResult:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeasurementResult'
    PriceConfirmationRequest:
      type: object
      required: [feeAdjustmentId, expectedFee, version]
      properties:
        feeAdjustmentId:
          $ref: '#/components/schemas/Id'
        expectedFee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 用于服务端校验的期望值，最终费用取 adjustment.after_amount。
        version:
          type: integer
          format: int64
          minimum: 0
    OutboundRequest:
      type: object
      required: [trackingNo, outboundAt, version]
      properties:
        trackingNo:
          type: string
        outboundAt:
          $ref: '#/components/schemas/UtcDateTime'
        handoverRemark:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    OutboundResult:
      type: object
      properties:
        outboundRecordId:
          $ref: '#/components/schemas/Id'
        orderId:
          $ref: '#/components/schemas/Id'
        trackingNo:
          type: string
        currentStatus:
          type: string
          enum: [OUTBOUND]
    ApiSuccessOutbound:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OutboundResult'
    TrackingEventInput:
      type: object
      required: [trackingNo, eventId, eventCode, eventTime, rawPayload]
      properties:
        trackingNo:
          type: string
        eventId:
          type: string
        eventCode:
          type: string
          maxLength: 64
          description: PICKED_UP、DEPARTED、IN_TRANSIT 映射为 IN_TRANSIT；DELIVERED、RETURNED、LOST 映射为同名订单状态。
        eventDescription:
          type: string
        eventTime:
          $ref: '#/components/schemas/UtcDateTime'
        rawPayload:
          type: object
          additionalProperties: true
    TrackingCallbackRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TrackingEventInput'
    TrackingEventResult:
      type: object
      required: [eventId, status]
      properties:
        eventId:
          type: string
        status:
          type: string
          enum: [ACCEPTED, DUPLICATE, REJECTED, RETRY]
        errorCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
    TrackingResult:
      type: object
      required: [accepted, duplicated, rejected, events]
      properties:
        accepted:
          type: integer
        duplicated:
          type: integer
        rejected:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEventResult'
    ApiSuccessTrackingResult:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrackingResult'
    TrackingEventView:
      type: object
      required: [id, trackingNo, eventId, eventCode, eventTime, receivedTime, processStatus]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        trackingNo:
          type: string
        eventId:
          type: string
        eventCode:
          type: string
        eventDescription:
          type: string
        eventTime:
          $ref: '#/components/schemas/UtcDateTime'
        receivedTime:
          $ref: '#/components/schemas/UtcDateTime'
        processStatus:
          type: string
          enum: [PENDING, PROCESSED, RETRY, REJECTED]
    TrackingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrackingEventView'
    ApiSuccessTrackingPage:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrackingPage'
    BillBatch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        batchNo:
          type: string
        fileHash:
          type: string
        status:
          type: string
          enum: [PROCESSING, PARTIAL_SUCCESS, SUCCESS, FAILED]
        totalCount:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
    ApiSuccessBillBatch:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BillBatch'
    BillBatchPage:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BillBatch' } } } }]
    ApiSuccessBillBatchPage:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/BillBatchPage' } } }]
    BillDetail:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        batchId: { $ref: '#/components/schemas/Id' }
        providerId: { $ref: '#/components/schemas/Id' }
        providerBillDetailNo: { type: string }
        lineNo: { type: integer }
        shipmentOrderId: { $ref: '#/components/schemas/Id', nullable: true }
        trackingNo: { type: string, nullable: true }
        billedAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        feeType: { type: string }
        detailStatus: { type: string, enum: [IMPORTED, MATCHED, ERROR] }
        errorMessage: { type: string, nullable: true }
    BillDetailPage:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BillDetail' } } } }]
    ApiSuccessBillDetailPage:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/BillDetailPage' } } }]
    Reconciliation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        shipmentOrderId:
          $ref: '#/components/schemas/Id'
        billDetailId:
          $ref: '#/components/schemas/Id'
        systemAmount:
          $ref: '#/components/schemas/Money'
        billedAmount:
          $ref: '#/components/schemas/Money'
        differenceAmount:
          $ref: '#/components/schemas/SignedMoney'
        reconciliationStatus:
          type: string
          enum: [AUTO_CLOSED, PENDING_CONFIRMATION, CONFIRMED, REJECTED]
        version:
          type: integer
          format: int64
    ApiSuccessReconciliation:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Reconciliation'
    ReconciliationPage:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Reconciliation' } } } }]
    ApiSuccessReconciliationPage:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/ReconciliationPage' } } }]
    ReconciliationConfirmRequest:
      type: object
      required: [resolutionType, remark, version]
      properties:
        resolutionType:

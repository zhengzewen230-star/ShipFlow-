        channelId:
          $ref: '#/components/schemas/Id'
        declaredWeight:
          $ref: '#/components/schemas/Weight'
        declaredLength:
          $ref: '#/components/schemas/Dimension'
        declaredWidth:
          $ref: '#/components/schemas/Dimension'
        declaredHeight:
          $ref: '#/components/schemas/Dimension'
        destinationCountry:
          $ref: '#/components/schemas/CountryCode'
    ApiSuccessQuote:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Quote'
    QuotePage:

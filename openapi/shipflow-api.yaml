    ApiSuccessOnboardingApplication: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingApplication' } } }] }
    ApiSuccessOnboardingPage: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingPage' } } }] }
    ApiSuccessActivation: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/ActivationResponse' } } }] }
    ApiSuccessOnboardingApproval: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingApproval' } } }] }
    Id:
      type: string
      pattern: '^[0-9]+$'
      example: '10001'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '58.00'
      description: 非负金额，JSON 中使用字符串。
    SignedMoney:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      example: '-2.50'
      description: 可为负数的金额，JSON 中使用字符串。
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      example: JP
      description: 大写 ISO 3166-1 alpha-2 国家编码。
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: USD
      description: 大写 ISO 4217 三位币种编码。
    Weight:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      example: '1.500'
      description: 重量，统一使用 kg，JSON 中使用字符串。
    Dimension:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      example: '20.000'
      description: 尺寸，统一使用 cm，JSON 中使用字符串。
    UtcDateTime:
      type: string
      format: date-time
      example: '2026-08-02T10:30:00.000Z'
      description: UTC ISO-8601 时间。
    TemporaryPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$'
      description: 仅用于首次设置密码，服务端使用 BCrypt 保存，不保存或返回明文。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
        tenantCode:
          type: string
          maxLength: 64
          nullable: true
          description: 为空时只匹配平台用户，非空时只匹配指定租户用户。
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        userId:
          $ref: '#/components/schemas/Id'
        tenantId:
          $ref: '#/components/schemas/Id'
    CurrentUserView:
      type: object
      required: [userId, username, scope, roles, permissions]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        displayName:
          type: string
        scope:
          type: string
          enum: [PLATFORM, TENANT]
        tenantId:
          $ref: '#/components/schemas/Id'
        roles:
          type: array
          description: 当前有效作用域内实际绑定的角色编码。
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    ApiSuccessCurrentUser:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUserView'
    ApiSuccess:
      type: object
      required: [success, traceId, data]
      properties:
        success:
          type: boolean
          enum: [true]
        traceId:
          type: string
        message:
          type: string
          example: OK
        data: {}
    ApiSuccessLogin:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'
    ApiError:
      type: object
      required: [success, traceId, error]
      properties:
        success:
          type: boolean
          enum: [false]
        traceId:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: ORDER-1001
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
    Quote:
      type: object
      required: [id, quoteNo, channelId, destinationCountry, declaredWeight, declaredChargeableWeight, amount, currency, feeDetail, validTo]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        quoteNo:
          type: string

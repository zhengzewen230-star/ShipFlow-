      responses: { '200': { description: 指定租户脱敏审计日志详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessAuditLog' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /exceptions:
    get:
      tags: [Exceptions]
      summary: 查询当前租户异常单
      operationId: listExceptionCases
      parameters:
        - { name: orderId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: exceptionType, in: query, schema: { type: string, enum: [ADDRESS, CUSTOMS, TRANSPORT, OTHER] } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PROCESSING, WAITING_PROVIDER_FEEDBACK, PENDING_FINANCE_CONFIRMATION, RESOLVED, CLOSED] } }
        - { name: orderNo, in: query, schema: { type: string, maxLength: 64 } }
        - { name: storeId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: responsibleParty, in: query, schema: { type: string, enum: [MERCHANT, PROVIDER, CUSTOMS, CUSTOMER, OTHER] } }
        - { name: createdFrom, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: createdTo, in: query, schema: { $ref: '#/components/schemas/UtcDateTime' } }
        - { name: workbenchFilter, in: query, description: 仅工作台使用；按调用方店铺范围过滤。, schema: { type: string, enum: [PENDING_FOLLOW_UP] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, updatedAt, status, exceptionType, orderNo], default: createdAt } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses: { '200': { description: 异常单分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessExceptionCasePage' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /exceptions/{exceptionId}:
    get:

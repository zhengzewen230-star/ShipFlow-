      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses: { '200': { description: 索赔详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /claims/{claimId}/submit:
    post:
      tags: [Exceptions]
      summary: 提交索赔
      operationId: submitClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimActionRequest' } } } }
      responses: { '200': { description: 提交成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /claims/{claimId}/result:
    post:
      tags: [Exceptions]
      summary: 审核通过或驳回索赔
      operationId: resolveClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResultRequest' } } } }
      responses: { '200': { description: 审核完成, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ExceptionClaimError' } }
  /claims/{claimId}/finance-confirmation:
    post:
      tags: [Exceptions]
      summary: 财务确认索赔结果
      operationId: financeConfirmClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceConfirmRequest' } } } }
      responses: { '200': { description: 财务确认成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ExceptionClaimError' } }
  /operations/summary:
    get:
      tags: [Operations]
      summary: 查询当前租户订单履约概览
      operationId: getOperationsSummary
      responses: { '200': { description: 各订单状态数量, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsSummary' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /operations/todos:
    get:
      tags: [Operations]
      summary: 查询当前租户跨域待办汇总
      operationId: getOperationsTodos
      responses: { '200': { description: 价格、对账、异常和索赔待办数量, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsTodos' } } } }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /operations/workbench:
    get:
      tags: [Operations]
      summary: 查询商家业务员运营概览工作台快照
      operationId: getOperationsWorkbench
      description: |
        只读概览快照。tenant_id 与 user_id 由 JWT 认证上下文取得，storeId 只能缩小后端重新计算的可见店铺范围。
        商家业务员仅能查看 ACTIVE 授权店铺，租户管理员及既有租户运营角色仅能查看本租户 ACTIVE 店铺。
        数据库时间按 UTC 存储和查询；TODAY/LAST_7_DAYS/LAST_30_DAYS 先按 Asia/Shanghai 计算自然日，再返回实际 UTC 窗口。
        refreshedAt、timeRange.from/to、订单和风险时间均为 UTC ISO-8601；金额使用 BigDecimal 两位小数语义，重量使用 kg。
      parameters:
        - name: timeRange
          in: query
          schema: { type: string, enum: [TODAY, LAST_7_DAYS, LAST_30_DAYS, CUSTOM], default: TODAY }
        - name: from
          in: query
          description: 仅 CUSTOM 使用，必须带 UTC offset 或 Z。
          schema: { $ref: '#/components/schemas/UtcDateTime' }
        - name: to
          in: query
          description: 仅 CUSTOM 使用，必须晚于 from，必须带 UTC offset 或 Z。
          schema: { $ref: '#/components/schemas/UtcDateTime' }
        - name: storeId
          in: query
          description: 可选店铺范围收窄条件，后端会再次校验租户、角色和 ACTIVE 授权归属。
          schema: { type: integer, format: int64, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [updatedAt, createdAt], default: updatedAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
        - name: recentLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: riskLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { description: 与同一租户/店铺授权范围和时间窗口一致的工作台快照, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsWorkbench' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/OrderRuleError' }
  /operations/workbench/metrics/{metricKey}/items:
    get:
      tags: [Operations]
      summary: 查询与首页指标同一事实谓词的分页明细
      operationId: getOperationsMetricDrilldown
      parameters:
        - name: metricKey
          in: path
          required: true
          schema: { type: string, enum: [PENDING_ORDERS, PENDING_INBOUND, PENDING_MEASUREMENT, PENDING_LABEL, PENDING_OUTBOUND, IN_TRANSIT, TRACKING_EXCEPTION, PENDING_FINANCE] }
        - name: timeRange
          in: query
          schema: { type: string, enum: [TODAY, LAST_7_DAYS, LAST_30_DAYS, CUSTOM], default: TODAY }
        - name: from
          in: query
          schema: { $ref: '#/components/schemas/UtcDateTime' }
        - name: to
          in: query
          schema: { $ref: '#/components/schemas/UtcDateTime' }
        - name: storeId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: total 与首页同一指标的 count 使用同一事实 SQL, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessOperationsMetricDrilldownPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouse/overview:
    get:
      tags: [Warehouse]
      summary: 查询当前租户仓库工作概览
      operationId: getWarehouseOverview
      description: 仅返回当前租户仓库操作员授权范围内的订单、轨迹异常和当日仓库操作统计。
      responses:
        '200': { description: 仓库工作概览, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessWarehouseOverview' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /warehouse/orders:
    get:
      tags: [Warehouse]
      summary: 查询当前租户仓库作业列表
      operationId: listWarehouseWork
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: orderNo
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 仓库作业分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessWarehouseWorkPage' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouse/orders/{orderId}:
    get:
      tags: [Warehouse]
      summary: 查询仓库作业详情
      operationId: getWarehouseWork
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 仓库作业详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessWarehouseWorkItem' } } } }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{claimId}/close:
    post:
      tags: [Exceptions]
      summary: 关闭已审核索赔
      operationId: closeClaim
      parameters: [{ name: claimId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimActionRequest' } } } }
      responses: { '200': { description: 关闭成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessClaim' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/AuthError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ExceptionClaimError' } }

  /orders/{orderId}/sf-international/{operation}:
    post:
      tags: [Warehouse]
      summary: Execute an approved SF International provider operation through ShipFlow
      operationId: executeSfInternationalOperation
      description: |
        The browser calls ShipFlow only. The backend validates tenant scope and warehouse:manage.
        CREATE_ORDER builds customerCode, customerOrderNo, senderInfo, receiverInfo and cargoDetails from the tenant order. UPLOAD_CERTIFY accepts the documented certification fields in msgData.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [CREATE_ORDER, PRINT_ORDER, QUERY_ORDER, CANCEL_ORDER, UPLOAD_CERTIFY] }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SfOperationRequest' }
      responses:
        '200': { description: Provider operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessSfOperation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  x-onboarding-schemas:
    CreateGuestEstimateRequest:
      type: object
      required: [originCountry, destinationCountry, transportMode, cargoType, cargoName, weight, volume, contactName, businessEmail, contactPhone]
      properties:
        originCountry: { type: string, pattern: '^[A-Z]{2}$' }
        destinationCountry: { type: string, pattern: '^[A-Z]{2}$' }
        transportMode: { type: string, enum: [OCEAN, AIR, ROAD, RAIL, COURIER] }
        cargoType: { type: string, enum: [GENERAL, BATTERY, SENSITIVE, LIQUID_POWDER, FRAGILE, OVERSIZED, OTHER] }
        cargoName: { type: string, minLength: 2, maxLength: 80 }
        weight: { type: number, format: decimal, minimum: 0.001 }
        volume: { type: number, format: decimal, minimum: 0.000001 }
        contactName: { type: string, maxLength: 128 }
        businessEmail: { type: string, format: email, maxLength: 254 }
        contactPhone: { type: string, maxLength: 64 }
    GuestEstimateResponse:
      type: object
      required: [referenceNo, status, formalQuote, notice, submittedAt]
      properties:
        referenceNo: { type: string }
        status: { type: string, enum: [RECEIVED] }
        formalQuote: { type: boolean, enum: [false] }
        notice: { type: string }
        submittedAt: { type: string, format: date-time }
    CreateOnboardingApplicationRequest:
      type: object
      required: [companyName, contactName, businessEmail, contactPhone, countryCode]
      properties:
        companyName: { type: string, maxLength: 128 }
        contactName: { type: string, maxLength: 128 }
        businessEmail: { type: string, format: email, maxLength: 254 }
        contactPhone: { type: string, maxLength: 64 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
    OnboardingApplication:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        applicationNo: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        businessEmail: { type: string, format: email }
        contactPhone: { type: string }
        countryCode: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reviewRemark: { type: string, nullable: true }
        tenantId: { $ref: '#/components/schemas/Id', nullable: true }
        initialUserId: { $ref: '#/components/schemas/Id', nullable: true }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
    OnboardingPage:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OnboardingApplication' } } } }]
    ApproveOnboardingApplicationRequest:
      type: object
      required: [tenantCode, adminUsername, reviewRemark, version]
      properties:
        tenantCode: { type: string, maxLength: 64 }
        adminUsername: { type: string, maxLength: 128 }
        reviewRemark: { type: string, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    RejectOnboardingApplicationRequest:
      type: object
      required: [reviewRemark, version]
      properties:
        reviewRemark: { type: string, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    ActivationRequest:
      type: object
      required: [invitationToken, password]
      properties:
        invitationToken: { type: string, writeOnly: true }
        password: { type: string, writeOnly: true, minLength: 12, maxLength: 128 }
    ActivationResponse:
      type: object
      properties: { tenantCode: { type: string }, username: { type: string }, status: { type: string, enum: [ACTIVE] } }
    OnboardingApproval:
      type: object
      properties: { application: { $ref: '#/components/schemas/OnboardingApplication' }, invitationToken: { type: string, writeOnly: true, description: Returned once only to PLATFORM reviewer for secure out-of-band delivery. } }
    ApiSuccessGuestEstimate:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/GuestEstimateResponse' } } }]
    ApiSuccessOnboardingApplication:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingApplication' } } }]
    ApiSuccessOnboardingPage:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingPage' } } }]
    ApiSuccessActivation:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/ActivationResponse' } } }]
    ApiSuccessOnboardingApproval:
      allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingApproval' } } }]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: REFRESH_TOKEN
      description: HttpOnly Refresh Token Cookie；客户端不可读取。
    providerHmac:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Base64 编码的 HMAC-SHA256 签名，签名原文为 timestamp + "." + rawRequestBody。
  headers:
    TraceId:
      description: 与响应体 traceId 一致的链路追踪 ID。
      schema:
        type: string
    NoStore:
      description: 禁止缓存认证凭证相关响应。
      schema:
        type: string
        enum: [no-store]
        default: no-store
    WWWAuthenticate:
      description: RFC 6750 Bearer 认证挑战；具体错误详情不在 Header 中泄露敏感信息。
      schema:
        type: string
        example: Bearer
    AuthCookies:
      description: Set-Cookie 下发 Refresh Token 和 XSRF-TOKEN。Refresh Cookie 使用 HttpOnly、Secure（生产）、SameSite=Strict、明确 Path 和 Max-Age=2592000。
      schema:
        type: string
    XsrfCookie:
      description: Set-Cookie 下发可读取的 XSRF-TOKEN。使用 Secure（生产）、SameSite=Strict、明确 Path 和 Max-Age=2592000，不设置 HttpOnly 和 Domain。
      schema:
        type: string
    ClearedAuthCookies:
      description: Set-Cookie 将 Refresh Token 和 XSRF-TOKEN 设置为过期，以清除 Cookie。
      schema:
        type: string
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReconciliationId:
      name: reconciliationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProviderCode:
      name: providerCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ProviderTimestamp:
      name: X-Provider-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10}$'
        example: '1785643200'
    XsrfCookie:
      name: XSRF-TOKEN
      in: cookie
      required: true
      description: 可由前端读取的 CSRF Cookie；不得设置 HttpOnly。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    XsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 必须与 XSRF-TOKEN Cookie 一致，由 CookieCsrfTokenRepository 校验。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 请求参数或格式错误。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthError:
      description: 未登录、Token 无效或已过期。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CsrfError:
      description: CSRF Cookie 与 X-XSRF-TOKEN 请求头缺失或不匹配。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 供应商服务暂时不可用或顺丰沙箱未完成配置。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 权限不足或跨租户访问。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等、乐观锁或订单状态冲突。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    QuoteRuleError:
      description: 报价业务规则校验失败。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OrderRuleError:
      description: 订单业务规则校验失败。
      headers:
        X-Trace-Id:

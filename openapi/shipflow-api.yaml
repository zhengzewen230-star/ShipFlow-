    OnboardingApproval: { type: object, properties: { application: { $ref: '#/components/schemas/OnboardingApplication' }, invitationToken: { type: string, writeOnly: true } } }
    ApiSuccessGuestEstimate: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { type: object, properties: { data: { $ref: '#/components/schemas/GuestEstimateResponse' } } }] }

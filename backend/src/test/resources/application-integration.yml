spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SHIPFLOW_IT_DB_URL}
    username: ${SHIPFLOW_IT_DB_USERNAME}
    password: ${SHIPFLOW_IT_DB_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    enabled: false

shipflow:
  security:
    refresh-token:
      enabled: true
      hmac-key: aW50ZWdyYXRpb24tdGVzdC1obWFjLWtleS0zMmJ5dGU=

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
